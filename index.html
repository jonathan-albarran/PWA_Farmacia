
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Farmacia Dulce María">
    <meta name="description" content="Registra y consulta medicamentos, existencias, precios y fechas de caducidad en Farmacia Dulce María.">

    <title>Farmacia Dulce María</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="top">
        <h1>
            <img src="Logo.png" alt="Logo de Farmacia Dulce María" class="logo">
            Farmacia Dulce María
        </h1>
        <span class="status" id="status">En línea</span>
    </header>

    <main>
        <section class="panel">
            <h2 id="titleForm" class="panel-title">Nuevo medicamento</h2>

            <form id="form" novalidate>

                <div class="field">
                    <label for="nombre">Nombre del medicamento</label>
                    <input type="text" id="nombre" name="nombre"
                        placeholder="Nombre" autocomplete="off" required>
                    <small class="error" id="err-nombre"></small>
                </div>

                <div class="field">
                    <label for="principio">Principio activo</label>
                    <input type="text" id="principio" name="principio"
                        placeholder="Ej. Paracetamol" autocomplete="off" required>
                    <small class="error" id="err-principio"></small>
                </div>

                <div class="field">
                    <label for="concentracion">Concentración</label>
                    <input type="text" id="concentracion" name="concentracion"
                        placeholder="Ej. Tabletas de 500 mg o jarabe de 100 ml" autocomplete="off" required>
                    <small class="error" id="err-concentracion"></small>
                </div>

                <div class="field">
                    <label for="descripcion">Descripción</label>
                    <input type="text" id="descripcion" name="descripcion"
                        placeholder="Ej. Tabletas, caja con 20 piezas"
                        autocomplete="off" required>
                    <small class="error" id="err-descripcion"></small>
                </div>

                <div class="field">
                    <label for="stock">Stock</label>
                    <input type="number" id="stock" name="stock"
                        placeholder="Cantidad disponible" min="0" step="1" required>
                    <small class="error" id="err-stock"></small>
                </div>

                <div class="field">
                    <label for="precio">Precio de venta</label>
                    <input type="number" id="precio" name="precio"
                        placeholder="Ej. 45.50" min="0" step="0.01" required>
                    <small class="error" id="err-precio"></small>
                </div>

                <div class="field">
                    <label for="caducidad">Fecha de caducidad</label>
                    <input type="date" id="caducidad" name="caducidad" required>
                    <small class="error" id="err-caducidad"></small>
                </div>

                <div class="actions">
                    <button type="submit" id="save" class="btn btn-save">
                        Guardar
                    </button>
                    <button type="reset" id="cancel" class="btn btn-cancel">
                        Cancelar
                    </button>
                </div>
            </form>
        </section>

        <section class="panel">
            <h2>Medicamentos registrados <span id="contador">0</span></h2>
            <ul id="lista" class="lista"></ul>
            <p id="vacio" class="vacio">No hay medicamentos registrados</p>
        </section>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="app.js"></script>
</body>
</html>
